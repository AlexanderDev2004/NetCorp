<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetCorp — The Garage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      body {
        margin: 0;
        background: #12141a;
        color: #d8dee9;
        display: flex;
        height: 100vh;
      }
      #board {
        flex: 1;
        min-width: 0;
        height: 100vh;
        display: block;
        background: #171a21;
      }
      aside {
        width: 340px;
        border-left: 1px solid #2a2f3a;
        display: flex;
        flex-direction: column;
      }
      aside h2 {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a93a5;
        margin: 0;
        padding: 10px 14px;
        border-bottom: 1px solid #2a2f3a;
      }
      #stats {
        padding: 10px 14px;
        border-bottom: 1px solid #2a2f3a;
        font-size: 13px;
        color: #a9b3c4;
      }
      #stats b {
        color: #7ee787;
        font-weight: 600;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
        font-size: 12.5px;
        line-height: 1.55;
      }
      #log .warn { color: #f0b429; }
      #log .alert { color: #ff6b6b; }
      #log .info { color: #9fb0c3; }
      #log .meta { color: #5a6372; }
    </style>
  </head>
  <body>
    <canvas id="board" width="1200" height="800"></canvas>
    <aside>
      <h2>NetCorp — The Garage</h2>
      <div id="stats"></div>
      <h2>Event log</h2>
      <div id="log"></div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
