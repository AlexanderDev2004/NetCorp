<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetCorp — The Garage</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Design tokens borrowed from Quorum (playquorum.dev). */
      :root {
        --signal: oklch(0.8 0.12 225);
        --danger: #e5484d;
        --warn: #f0b429;
        --ok: #6fcf8f;
        --ink: #eaebec;
        --muted: #8b9099;
        --panel: #18191c;
        --panel-shadow:
          inset 0 1px 0 oklch(1 0 0 / 0.06),
          0 0 0 1px oklch(1 0 0 / 0.07),
          0 24px 48px -16px oklch(0 0 0 / 0.8);
        --line: oklch(1 0 0 / 0.07);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        position: relative;
        background: #0c0c0d;
        color: var(--ink);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      #board {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      /* Decorative frame with corner brackets and ruler ticks, as in the hero art. */
      .frame {
        position: absolute;
        inset: 16px;
        border: 1px solid oklch(1 0 0 / 0.05);
        pointer-events: none;
      }
      .frame .corner {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -1px;
        border: 0 solid oklch(1 0 0 / 0.3);
      }
      .frame .tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
      .frame .tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
      .frame .bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
      .frame .br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
      .frame .ruler {
        position: absolute;
        top: 0;
        left: 80px;
        right: 80px;
        height: 6px;
        --tick: oklch(1 0 0 / 0.1);
        background:
          repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 80px) top / 100% 6px no-repeat,
          repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 10px) top / 100% 3px no-repeat;
      }

      .panel {
        background: var(--panel);
        border-radius: 14px;
        box-shadow: var(--panel-shadow);
      }
      button {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: -0.01em;
        border: 0;
        border-radius: 9px;
        padding: 7px 12px;
        cursor: pointer;
        background: oklch(1 0 0 / 0.05);
        color: var(--ink);
        box-shadow: 0 0 0 1px oklch(1 0 0 / 0.09);
      }
      button:hover { background: oklch(1 0 0 / 0.09); }
      button.active {
        color: var(--signal);
        box-shadow: 0 0 0 1px var(--signal);
        background: oklch(0.8 0.12 225 / 0.09);
      }
      button.primary {
        background: linear-gradient(#fbfbfb, #dfe0e2);
        color: #1d1e21;
        box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.6), 0 1px 2px oklch(0 0 0 / 0.3);
      }
      button.primary:hover { background: linear-gradient(#ffffff, #e8e9eb); }
      button.danger {
        color: var(--danger);
        box-shadow: 0 0 0 1px oklch(0.63 0.2 23 / 0.5);
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      select, input {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 12.5px;
        background: oklch(1 0 0 / 0.05);
        color: var(--ink);
        border: 0;
        border-radius: 8px;
        padding: 6px 8px;
        box-shadow: 0 0 0 1px oklch(1 0 0 / 0.09);
        outline: none;
      }
      input:focus { box-shadow: 0 0 0 1px var(--signal); }
      input.wide { width: 150px; }
      label { color: var(--muted); }

      /* HUD — top left card, one figure per row, as in Quorum. */
      #hud {
        position: absolute;
        top: 28px;
        left: 28px;
        width: 240px;
        padding: 12px 14px;
        pointer-events: auto;
      }
      #hud .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      #hud .brand {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 12px;
      }
      #hud .brand::after { content: ' ·'; color: var(--signal); }
      #hud .calendar {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11.5px;
        color: var(--muted);
      }
      #hud .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 3px 0;
        font-size: 12.5px;
      }
      #hud .row .name { color: var(--muted); }
      #hud .row .value {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-weight: 500;
      }
      #hud .row .value.signal { color: var(--signal); }
      #hud .row .value.bad { color: var(--danger); }
      #hud .row .note { font-size: 11px; color: var(--muted); margin-left: 8px; }

      /* Toolbar — top right strip. */
      #toolbar {
        position: absolute;
        top: 28px;
        right: 28px;
        display: flex;
        gap: 6px;
        padding: 7px;
      }

      /* Build dock — bottom center row of catalog buttons. */
      #dock {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 7px;
        width: 860px;
        max-width: calc(100vw - 56px);
      }
      #dock button {
        display: flex;
        flex-direction: column;
        gap: 1px;
        align-items: flex-start;
        padding: 6px 10px;
        white-space: nowrap;
      }
      #dock button .price {
        font-size: 10.5px;
        color: var(--muted);
      }
      #dock button.active .price { color: var(--signal); }

      /* Round Inbox-style button — bottom right. */
      #inbox-btn {
        position: absolute;
        bottom: 156px;
        right: 28px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        font-size: 15px;
        padding: 0;
      }
      #inbox-btn.has-action {
        color: var(--danger);
        box-shadow: 0 0 0 1px var(--danger);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 1px var(--danger); }
        50% { box-shadow: 0 0 0 5px oklch(0.63 0.2 23 / 0.25); }
      }
      #inbox-btn .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: var(--danger);
        color: #0c0c0d;
        border-radius: 9px;
        padding: 1px 6px;
        font-size: 11px;
        font-weight: 600;
      }
      #inbox-btn .badge:empty { display: none; }
      /* While the mail panel is open, slide the button left of it. */
      body.mail-open #inbox-btn { right: 472px; }

      /* Inspector — floating panel on the right. */
      #inspector-panel {
        position: absolute;
        top: 92px;
        right: 28px;
        width: 360px;
        max-height: calc(100vh - 320px);
        display: none;
        flex-direction: column;
      }
      #inspector-panel.open { display: flex; }
      #inspector-panel .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 8px;
        font-weight: 600;
      }
      #inspector-panel .head .close {
        padding: 2px 8px;
        font-size: 12px;
      }
      #inspector {
        overflow-y: auto;
        padding: 0 14px 14px;
      }
      #inspector .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      #inspector .iface {
        border-radius: 10px;
        padding: 9px;
        margin-bottom: 8px;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      #inspector .iface .name {
        font-family: 'Geist Mono', ui-monospace, monospace;
        color: var(--signal);
        font-size: 12px;
        margin-bottom: 6px;
      }
      #inspector .muted { color: var(--muted); }
      #inspector .section {
        font-weight: 600;
        margin: 14px 0 8px;
      }
      #inspector .rule {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 12px;
      }
      #inspector .action-allow { color: var(--ok); }
      #inspector .action-deny { color: var(--danger); }
      #inspector .muted, .muted { color: var(--muted); }
      #inspector .source-note { font-size: 11px; }

      /* Mail panel — opens over the board from the round Inbox button. */
      #mail-panel {
        position: absolute;
        bottom: 156px;
        right: 28px;
        width: 420px;
        max-height: calc(100vh - 290px);
        display: none;
        flex-direction: column;
      }
      #mail-panel.open { display: flex; }
      #mail-panel .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 8px;
      }
      #mail-panel .tabs { display: flex; gap: 6px; }
      #mail-panel .tabs button.active {
        color: var(--signal);
        box-shadow: 0 0 0 1px var(--signal);
      }
      .mail-view {
        overflow-y: auto;
        padding: 0 14px 14px;
        min-height: 0;
      }
      .mail-row {
        border-radius: 10px;
        padding: 9px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .mail-row:hover { background: oklch(1 0 0 / 0.04); }
      .mail-row .from {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .mail-row .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--signal);
        flex-shrink: 0;
      }
      .mail-row.read .dot { background: transparent; box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.2); }
      .mail-row .subject { font-weight: 600; font-size: 12.5px; margin-top: 2px; }
      .mail-row.read .subject { font-weight: 400; color: var(--muted); }
      .mail-row .snippet {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mail-kind {
        margin-left: auto;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        flex-shrink: 0;
      }
      .mail-read { min-height: 0; }
      .mail-read .back { padding: 3px 8px; font-size: 11.5px; margin-bottom: 8px; }
      .mail-read .from { color: var(--signal); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; }
      .mail-read .subject { font-weight: 600; font-size: 14px; margin: 6px 0 8px; }
      .mail-read .body { color: var(--ink); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; }
      .mail-read .body .link { color: var(--signal); text-decoration: underline; }
      .mail-read .actions { display: flex; gap: 8px; margin-top: 14px; }
      .mail-read .outcome {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
        color: var(--warn);
        box-shadow: inset 0 0 0 1px oklch(0.78 0.14 85 / 0.4);
      }
      .mail-read .outcome.bad { color: var(--danger); box-shadow: inset 0 0 0 1px oklch(0.63 0.2 23 / 0.4); }
      .mail-read .outcome.good { color: var(--ok); box-shadow: inset 0 0 0 1px oklch(0.8 0.14 145 / 0.4); }
      #tickets {
        overflow-y: auto;
        padding: 0 14px 14px;
      }
      .ticket {
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .ticket.breached { box-shadow: inset 0 0 0 1px var(--danger); }
      .ticket .client {
        color: var(--signal);
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .ticket .title { font-weight: 600; margin: 4px 0; }
      .ticket .symptom { color: var(--muted); font-size: 12px; line-height: 1.5; }
      .ticket .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
      .ticket .sla-ok { color: var(--ok); }
      .ticket .sla-warn { color: var(--warn); }
      .ticket .sla-breach { color: var(--danger); }
      .ticket.resolved { opacity: 0.5; }
      .ticket .reward { color: var(--ok); }
      .ticket .penalty { color: var(--danger); }

      /* Event log — slim card, bottom left. */
      #log-panel {
        position: absolute;
        bottom: 148px;
        left: 28px;
        width: 340px;
        max-height: 150px;
        overflow: hidden;
        padding: 8px 12px;
        font-size: 11.5px;
        line-height: 1.5;
        opacity: 0.92;
      }
      #log-panel .log-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #log-panel .warn { color: var(--warn); }
      #log-panel .alert { color: var(--danger); }
      #log-panel .info { color: var(--muted); }
      #log-panel .debug { color: oklch(1 0 0 / 0.35); }
      #log-panel .meta { color: oklch(1 0 0 / 0.35); }

      /* Toast — top center, one line, fades out. */
      #toast {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        max-width: 60vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #toast.show { opacity: 1; }

      #hint {
        position: absolute;
        bottom: 172px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11.5px;
        color: var(--muted);
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      body.mail-open #hint { opacity: 0; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div class="frame">
      <span class="ruler"></span>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>

    <div id="hud" class="panel">
      <div class="head">
        <span class="brand">NetCorp</span>
        <span class="calendar" id="hud-calendar">D1 00:00</span>
      </div>
      <div class="row"><span class="name">Cash</span><span class="value signal" id="hud-cash">$0</span></div>
      <div class="row"><span class="name">Reputation</span><span class="value" id="hud-rep">0</span></div>
      <div class="row"><span class="name">Insight</span><span class="value" id="hud-insight">0</span></div>
      <div class="row"><span class="name">Devices</span><span class="value" id="hud-devices">0</span></div>
    </div>

    <div id="toolbar" class="panel">
      <button id="mode-select">Select (S)</button>
      <button id="mode-wire">Wire (W)</button>
      <button id="mode-place">Place (P)</button>
      <button id="clock">Pause</button>
    </div>

    <div id="dock" class="panel"></div>

    <div id="inspector-panel" class="panel">
      <div class="head">
        <span>Inspector</span>
        <button class="close" id="inspector-close">Esc</button>
      </div>
      <div id="inspector"></div>
    </div>

    <div id="mail-panel" class="panel">
      <div class="head">
        <div class="tabs">
          <button id="mail-tab-mail" class="active">Mail <span id="mail-badge" class="badge"></span></button>
          <button id="mail-tab-tickets">Tickets <span id="ticket-badge" class="badge"></span></button>
        </div>
        <button class="close" id="mail-close">✕</button>
      </div>
      <div id="mail-view" class="mail-view"></div>
      <div id="tickets" class="hidden"></div>
    </div>

    <button id="inbox-btn" title="Mail (T)">✉<span class="badge" id="inbox-badge"></span></button>

    <div id="log-panel"></div>
    <div id="toast" class="panel"></div>
    <div id="hint"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
