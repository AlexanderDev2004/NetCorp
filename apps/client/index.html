<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetCorp — Network Operations</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Design tokens — Modern Dark NOC ===== */
      :root {
        --bg: #0b0d10;
        --panel: #14171c;
        --panel-2: #1b2027;
        --line: #2a3038;
        --accent: #35bdeb;
        --accent-dim: oklch(1 0 0 / 0.09);
        --ok: #36c98f;
        --warn: #f2b84b;
        --danger: #ef6262;
        --ink: #e7eaf0;
        --muted: #929aa7;
        --faint: oklch(1 0 0 / 0.4);
        --shadow: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 12px 32px -12px oklch(0 0 0 / 0.7);
        --radius: 10px;
        --radius-sm: 7px;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
      .hidden { display: none !important; }

      button {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: -0.01em;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        cursor: pointer;
        background: var(--panel-2);
        color: var(--ink);
        transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      }
      button:hover { background: oklch(1 0 0 / 0.06); border-color: oklch(1 0 0 / 0.18); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.active {
        color: var(--accent);
        border-color: var(--accent);
        background: oklch(0.75 0.12 225 / 0.1);
      }
      button.danger { color: var(--danger); }
      button.danger:hover { border-color: var(--danger); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      select, input {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 12px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 6px 8px;
        outline: none;
      }
      input:focus, select:focus { border-color: var(--accent); }
      label { color: var(--muted); }

      /* ===== App shell: bar / (sidebar | workspace+console) ===== */
      #topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
        z-index: 30;
      }
      #topbar .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding-right: 10px;
        border-right: 1px solid var(--line);
      }
      #topbar .brand .mark {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(135deg, var(--accent), oklch(0.55 0.15 260));
        box-shadow: 0 0 0 1px oklch(1 0 0 / 0.15) inset;
      }
      #topbar .brand .mark::after {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        margin: 6px auto;
        border-radius: 50%;
        background: #0b0d10;
      }
      #topbar .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 3px 10px;
        border-radius: var(--radius-sm);
        background: var(--panel-2);
        border: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      #topbar .stat .value {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-weight: 600;
        font-size: 12.5px;
        color: var(--ink);
      }
      #topbar .stat.cash .value { color: var(--accent); }
      #topbar .stat.cash .value.bad { color: var(--danger); }
      #topbar .stat.rep .value.bad { color: var(--danger); }
      #topbar .stat .value.bad { color: var(--danger); }
      #topbar .spacer { flex: 1; }
      #topbar .sim-state {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11px;
        color: var(--muted);
      }
      #topbar .sim-state .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 6px oklch(0.75 0.15 155 / 0.6);
        animation: simpulse 2s ease-in-out infinite;
      }
      #topbar .sim-state.paused .dot { background: var(--warn); box-shadow: none; animation: none; }
      @keyframes simpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      #topbar button.active { color: var(--warn); border-color: var(--warn); }
      #topbar button.active:hover { border-color: var(--warn); }
      #topbar .speed-btn { font-size: 11px; padding: 4px 7px; min-width: 40px; }
      #topbar .iconbtn {
        position: relative;
        width: 34px;
        height: 30px;
        padding: 0;
        font-size: 14px;
        display: grid;
        place-items: center;
      }
      #topbar .iconbtn.has-action { color: var(--danger); border-color: var(--danger); animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 oklch(0.68 0.19 23 / 0.4); } 50% { box-shadow: 0 0 0 4px oklch(0.68 0.19 23 / 0.12); } }
      #topbar .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--danger);
        color: #0b0d10;
        border-radius: 9px;
        padding: 1px 5px;
        font-size: 10px;
        font-weight: 600;
        font-family: 'Geist Mono', ui-monospace, monospace;
      }
      #topbar .badge:empty { display: none; }

      #main { display: flex; flex: 1; min-height: 0; }

      /* ===== Left sidebar: tools + catalog ===== */
      #sidebar {
        width: 250px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-right: 1px solid var(--line);
        min-height: 0;
        transition: width 0.15s ease, margin 0.15s ease;
      }
      body.rail-collapsed #sidebar { width: 0; overflow: hidden; border-right: none; }
      #sidebar .side-scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 10px; }
      #sidebar .section-title {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 2px 8px;
      }
      #sidebar .section-title:first-child { margin-top: 2px; }
      #tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      #tools button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }
      #tools button .key {
        font-size: 9.5px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        line-height: 1.5;
      }
      #tools button.active .key { color: var(--accent); border-color: var(--accent); }
      #catalog-search {
        width: 100%;
        margin-bottom: 8px;
      }
      #catalog { display: flex; flex-direction: column; gap: 6px; }
      .catalog-item {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 8px 10px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--panel-2);
        cursor: pointer;
        width: 100%;
      }
      .catalog-item:hover { border-color: oklch(1 0 0 / 0.2); }
      .catalog-item.active { border-color: var(--accent); background: oklch(0.75 0.12 225 / 0.08); }
      .catalog-item .icon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
      .catalog-item .info { min-width: 0; flex: 1; }
      .catalog-item .name { display: block; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .catalog-item .desc { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .catalog-item .price {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .catalog-item.active .price { color: var(--accent); }
      #catalog .empty { color: var(--muted); font-size: 11.5px; padding: 8px 2px; }

      /* ===== Center workspace ===== */
      #workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
      #board { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      #hint {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11.5px;
        color: var(--muted);
        background: oklch(0.1 0 0 / 0.72);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 14px;
        pointer-events: none;
        z-index: 10;
        transition: opacity 0.15s ease;
        max-width: 70%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body.mail-open #hint { opacity: 0; }
      body.shop-open #hint { opacity: 0; }

      /* ===== Season goal chip (theme modifier on the board) ===== */
      #season-goal {
        position: absolute;
        top: 10px;
        left: 10px;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11px;
        color: var(--accent);
        background: oklch(0.1 0 0 / 0.72);
        border: 1px solid oklch(0.75 0.15 155 / 0.4);
        border-radius: 999px;
        padding: 4px 12px;
        pointer-events: none;
        z-index: 5;
      }
      #season-goal.hidden { display: none; }

      /* ===== Right inspector ===== */
      #inspector-panel {
        width: 330px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line);
        min-height: 0;
        transition: width 0.15s ease;
      }
      body.inspector-collapsed #inspector-panel { width: 0; overflow: hidden; border-left: none; }
      #inspector-panel .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        flex-shrink: 0;
      }
      #inspector-panel .head .title { font-size: 13px; }
      #inspector-panel .head .close { padding: 2px 9px; font-size: 12px; }
      #inspector { overflow-y: auto; flex: 1; min-height: 0; padding: 12px 14px; }
      #inspector .empty-state {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        padding: 18px 6px;
        text-align: center;
      }
      #inspector .empty-state .glyph { font-size: 26px; margin-bottom: 8px; opacity: 0.6; }
      #inspector .device-head { margin-bottom: 4px; }
      #inspector .device-head .dname { font-size: 15px; font-weight: 600; }
      #inspector .device-head .dmodel { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
      #inspector .device-head .dstatus { margin-top: 8px; }
      #inspector .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        border-radius: 6px;
        padding: 2px 8px;
      }
      #inspector .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      #inspector .status.up { color: var(--ok); border: 1px solid oklch(0.75 0.15 155 / 0.45); }
      #inspector .status.down { color: var(--danger); border: 1px solid oklch(0.68 0.19 23 / 0.45); }
      /* Collapsible sections */
      #inspector details { margin-bottom: 10px; }
      #inspector details > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 7px 4px;
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      #inspector details > summary::-webkit-details-marker { display: none; }
      #inspector details > summary::before { content: '▸'; transition: transform 0.12s ease; font-size: 9px; }
      #inspector details[open] > summary::before { transform: rotate(90deg); }
      #inspector details > summary:hover { color: var(--ink); }
      #inspector details > .section-body { padding: 10px 2px 2px; }
      #inspector .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      #inspector .iface {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 9px;
        margin-bottom: 8px;
        background: var(--panel-2);
      }
      #inspector .iface .name {
        font-family: 'Geist Mono', ui-monospace, monospace;
        color: var(--ink);
        font-size: 12px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #inspector .iface .name .ifname { color: var(--accent); }
      #inspector .iface .name .ifmeta { color: var(--muted); font-size: 10.5px; }
      #inspector button.iface-toggle {
        margin-left: auto;
        font-size: 10.5px;
        padding: 2px 8px;
      }
      #inspector .source-note { font-size: 11px; }
      #inspector .sfp-slot { font-size: 11px; }
      #inspector .sfp-slot .sfp-installed {
        color: var(--accent);
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11px;
      }
      #inspector .sfp-slot .module-install {
        font-size: 10.5px;
        padding: 2px 8px;
      }
      #inspector .muted { color: var(--muted); }
      #inspector .rule {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        margin-bottom: 6px;
        background: var(--panel-2);
      }
      #inspector .rule .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #inspector .action-allow { color: var(--ok); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; text-transform: uppercase; }
      #inspector .action-deny { color: var(--danger); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; text-transform: uppercase; }
      #inspector input.wide { width: 150px; }
      #inspector .diag-result {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11.5px;
        line-height: 1.6;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        margin-bottom: 8px;
      }
      #inspector .diag-result.ok { color: var(--ok); border-color: oklch(0.75 0.15 155 / 0.45); }
      #inspector .diag-result.fail { color: var(--danger); border-color: oklch(0.68 0.19 23 / 0.45); }

      /* ===== Bottom operations console ===== */
      #console {
        height: 170px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-top: 1px solid var(--line);
        transition: height 0.15s ease;
      }
      body.console-collapsed #console { height: 34px; }
      body.console-collapsed #console .console-body { display: none; }
      #console .console-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
        height: 34px;
      }
      #console .console-head .ctitle {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-right: 8px;
      }
      #console .ctab {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11.5px;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
      }
      #console .ctab:hover { color: var(--ink); background: var(--accent-dim); }
      #console .ctab.active { color: var(--accent); background: oklch(0.75 0.12 225 / 0.1); }
      #console .console-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px; }
      #console .log-line {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11.5px;
        line-height: 1.65;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #console .log-line .meta { color: var(--faint); }
      #console .log-line.info { color: var(--muted); }
      #console .log-line.warn { color: var(--warn); }
      #console .log-line.alert { color: var(--danger); }
      #console .log-line.debug { color: var(--faint); }
      #console .sev {
        display: inline-block;
        width: 8px;
        text-align: center;
        margin-right: 4px;
      }
      #console .console-empty { color: var(--faint); font-size: 11.5px; padding: 8px 2px; }
      /* Diagnostics tab: last ping result + path summary */
      #console #diag-view { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; line-height: 1.7; }
      #console #diag-view .di { color: var(--muted); }
      #console #diag-view .di b { color: var(--ink); font-weight: 600; }
      #console #diag-view .ok { color: var(--ok); }
      #console #diag-view .fail { color: var(--danger); }

      /* ===== Mail drawer (slides over workspace) ===== */
      #mail-panel {
        position: fixed;
        top: 44px;
        bottom: 0;
        right: 0;
        width: 444px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -24px 0 48px -24px oklch(0 0 0 / 0.8);
        transform: translateX(105%);
        transition: transform 0.18s ease;
        z-index: 40;
        display: flex;
        flex-direction: column;
      }
      #mail-panel.open { transform: translateX(0); }
      #mail-panel .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      #mail-panel .tabs { display: flex; gap: 6px; flex: 1; }
      #mail-panel .badge {
        background: var(--danger);
        color: #0b0d10;
        border-radius: 9px;
        padding: 1px 6px;
        font-size: 10px;
        font-weight: 600;
        font-family: 'Geist Mono', ui-monospace, monospace;
      }
      #mail-panel .badge:empty { display: none; }
      /* The discard-folder count: quieter than the unread badge. */
      #mail-panel .badge.discard { background: oklch(0.55 0.02 260 / 0.9); color: var(--muted); }
      #mail-panel .head .close { padding: 2px 9px; }
      #mail-view, #tickets { overflow-y: auto; flex: 1; min-height: 0; padding: 10px 14px; }
      .mail-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 9px 10px;
        border-radius: var(--radius);
        margin-bottom: 7px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--panel-2);
      }
      .mail-row:hover { border-color: oklch(1 0 0 / 0.2); }
      .mail-row.read { opacity: 0.62; }
      .mail-row .from { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink); min-width: 0; }
      .mail-row .from .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
      .mail-row.read .from .dot { background: var(--line); }
      /* Experience flags suspected phishing straight in the list. */
      .mail-row.phish-flagged,
      .mail-row.phish-flagged:hover {
        border-color: oklch(0.63 0.2 23 / 0.6);
        background: oklch(0.63 0.2 23 / 0.08);
      }
      .mail-row.phish-flagged .from .dot { background: var(--danger); }
      .mail-row .subject { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mail-row .snippet { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* Inbox / Discarded folder switch at the top of the mail list. */
      .folder-switch { display: flex; gap: 6px; margin-bottom: 10px; }
      .folder-switch button {
        padding: 3px 12px;
        font-size: 11.5px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .folder-switch button.active { color: var(--ink); border-color: var(--accent); background: oklch(0.75 0.12 200 / 0.12); }
      button.mail-discard { margin-top: 4px; }
      .mail-kind {
        margin-left: auto;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 9.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        flex-shrink: 0;
      }
      .mail-read { min-height: 0; }
      .mail-read .back { padding: 3px 8px; font-size: 11.5px; margin-bottom: 8px; }

        transition: opacity 0.25s ease;
        pointer-events: none;
        max-width: 60vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 50;
        background: var(--panel-2);
        border: 1px solid var(--warn);
        border-radius: var(--radius-sm);
      }
      #toast.show { opacity: 1; }

      /* ===== Responsive ===== */
      @media (max-width: 1080px) {
        #sidebar { position: fixed; left: 0; top: 44px; bottom: 0; z-index: 35; width: 250px; }
        body.rail-collapsed #sidebar { margin-left: -250px; width: 250px; }
        #inspector-panel { position: fixed; right: 0; top: 44px; bottom: 0; z-index: 35; width: 330px; }
        body.inspector-collapsed #inspector-panel { margin-right: -330px; width: 330px; }
        /* The inspector overlays the workspace on small screens; keep the
           console's text out from under it. */
        #console { margin-right: 330px; }
        body.inspector-collapsed #console { margin-right: 0; }
        body.mail-open #mail-panel { width: min(444px, 100vw); }
        #shop-panel { width: min(480px, 100vw); }
      }
      @media (max-width: 780px) {
        #topbar .stat .label { display: none; }
        #topbar .stat { padding: 3px 7px; }
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <div class="brand"><span class="mark"></span><span>NetCorp</span></div>
      <div class="stat"><span class="label">Day</span><span class="value" id="hud-calendar">D1 00:00</span></div>
      <div class="stat cash"><span class="label">Cash</span><span class="value" id="hud-cash">$0</span></div>
      <div class="stat rep"><span class="label">Reputation</span><span class="value" id="hud-rep">0</span></div>
      <div class="stat"><span class="label">Insight</span><span class="value" id="hud-insight">0</span></div>
      <div class="stat"><span class="label">Devices</span><span class="value" id="hud-devices">0</span></div>
      <div class="spacer"></div>
      <div class="sim-state" id="sim-state"><span class="dot"></span><span id="sim-label">RUNNING</span></div>
      <button id="clock" title="Run / pause the clock (Space)">Pause</button>
      <button id="speed-btn" title="Game speed — click or press V to cycle: 1x → 2x → 5x → 10x → 0.5x → 1x">1x</button>
      <button id="hard-btn" title="Hard mode: clock runs twice as fast, payouts shrink 20%, worn hardware fails sooner">Hard</button>
      <button id="shop-btn" title="Equipment store (B)">Shop</button>
      <button id="toggle-sidebar" title="Toggle catalog sidebar">Catalog</button>
      <button id="research-btn" title="Research &amp; technology (R)">Research</button>
      <button id="toggle-inspector" title="Toggle inspector">Inspector</button>
      <button class="iconbtn" id="inbox-btn" title="Mail &amp; tickets (T)">✉<span class="badge" id="inbox-badge"></span></button>
    </header>

    <div id="main">
      <aside id="sidebar">
        <div class="side-scroll">
          <div class="section-title">Tools</div>
          <div id="tools">
            <button id="mode-select" title="Select and move (S)">Select <span class="key">S</span></button>
            <button id="mode-wire" title="Wire two devices (W)">Wire <span class="key">W</span></button>
            <button id="mode-place" title="Place the selected device (P)">Place <span class="key">P</span></button>
            <button id="tool-delete" title="Delete selected device (Del)">Delete <span class="key">⌫</span></button>
          </div>
          <div class="section-title">Device Catalog</div>
          <input id="catalog-search" type="search" placeholder="search catalog…" aria-label="Search device catalog" />
          <div id="catalog"></div>
        </div>
      </aside>

      <div id="workspace">
        <canvas id="board"></canvas>
        <div id="season-goal" class="hidden"></div>
        <div id="hint"></div>
      </div>

      <aside id="inspector-panel">
        <div class="head">
          <span class="title">Inspector</span>
          <button class="close" id="inspector-close">Esc</button>
        </div>
        <div id="inspector"></div>
      </aside>
    </div>

    <footer id="console">
      <div class="console-head">
        <span class="ctitle">Operations</span>
        <button class="ctab active" id="ctab-events">Events</button>
        <button class="ctab" id="ctab-diag">Diagnostics</button>
        <button class="ctab" id="ctab-activity">Network Activity</button>
        <div class="spacer" style="flex:1"></div>
        <button id="console-toggle" title="Collapse / expand console">▾</button>
      </div>
      <div class="console-body" id="console-body">
        <div id="events-view"></div>
        <div id="diag-view" class="hidden"></div>
        <div id="activity-view" class="hidden"></div>
      </div>
    </footer>

    <div id="mail-panel">
      <div class="head">
        <div class="tabs">
          <button id="mail-tab-mail" class="active">Mail <span id="mail-badge" class="badge"></span><span id="discard-badge" class="badge discard"></span></button>
          <button id="mail-tab-tickets">Tickets <span id="ticket-badge" class="badge"></span></button>
          <button id="mail-tab-contracts">Contracts</button>
        </div>
        <button class="close" id="mail-close">✕</button>
      </div>
      <div id="mail-view" class="mail-view"></div>
      <div id="tickets" class="hidden"></div>
      <div id="contracts" class="hidden"></div>
    </div>

    <div id="shop-panel">
      <div class="head">
        <span class="title">Equipment Store</span>
        <span class="shop-cash mono">Balance <b id="shop-cash">$0</b></span>
        <button class="close" id="shop-close">✕</button>
      </div>
      <div id="shop-view"></div>
    </div>

    <div id="research-panel">
      <div class="head">
        <span class="title">Research &amp; Technology</span>
        <span class="shop-cash mono">Insight <b id="research-insight">0</b></span>
        <div class="rsearch" title="Search every branch — / to focus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="research-search" placeholder="Search nodes — name, capability, era…" autocomplete="off" />
          <kbd>/</kbd>
        </div>
        <button class="close" id="research-close">✕</button>
      </div>
      <div id="research-view"></div>
    </div>

    <div id="prestige-overlay" class="hidden">
      <div class="prestige-card">
        <div class="p-season" id="prestige-season">SEASON COMPLETE</div>
        <div class="p-score mono" id="prestige-score">0</div>
        <div class="p-rank" id="prestige-rank"></div>
        <div class="p-breakdown" id="prestige-breakdown"></div>
        <div class="p-career" id="prestige-career"></div>
        <button id="prestige-continue">Keep playing</button>
        <div class="p-note">The next season has already begun — the career total is what the region remembers.</div>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
